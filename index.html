<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전킥 — 공유킥보드 인도주행 감지 | 10826 정연우</title>
<meta name="description" content="CNN으로 노면을 판별해 전동킥보드의 인도주행을 실시간으로 감지하는 프로그램">

<!-- ═══════════════════════════════════════════════════════════════
     [이미지 안내]  저장소를 아래처럼 만드세요.
       index.html
       project.html
       images/
         └ hero.jpg      ← 이 페이지 배경 (권장 1920×1080 이상, 인도/킥보드 사진)
     경로는 아래 :root 의 --hero-image 한 줄만 고치면 됩니다.
     이미지가 없어도 어두운 아스팔트 그라데이션으로 정상 표시됩니다.
     ═══════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  /* ▼▼▼ 배경 이미지 경로 — 여기만 바꾸세요 ▼▼▼ */
  --hero-image: url('images/hero.jpg');
  /* ▲▲▲ 이미지가 없으면 아래 그라데이션만 보입니다 ▲▲▲ */

  --asphalt-900:#0E1315;
  --asphalt-800:#171E21;
  --asphalt-600:#26333A;
  --steel:#3C5A69;
  --line-yellow:#F2C230;   /* 노면 차선 색 — 이 사이트의 기준색 */
  --paper:#EDEFEE;
  --muted:rgba(237,239,238,.60);

  --font-sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-sans);
  background:var(--asphalt-900);
  color:var(--paper);
  -webkit-font-smoothing:antialiased;
}

/* ── 히어로 ───────────────────────────────────────────── */
.hero{
  position:relative;
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:clamp(32px,6vw,80px) clamp(20px,5vw,64px);
  overflow:hidden;
  isolation:isolate;
}
/* 레이어 1 : 배경 이미지 + 아스팔트 톤 */
.hero::before{
  content:"";
  position:absolute; inset:0; z-index:-3;
  background-color:var(--asphalt-800);
  background-image:
    radial-gradient(110% 85% at 80% 10%, rgba(60,90,105,.55) 0%, transparent 60%),
    radial-gradient(95% 75% at 10% 90%, rgba(30,44,52,.75) 0%, transparent 62%),
    linear-gradient(160deg,#0C1113 0%,#1B242A 48%,#26333A 100%),
    var(--hero-image);
  background-size:cover,cover,cover,cover;
  background-position:center;
  background-blend-mode:screen,multiply,normal,normal;
}
/* 레이어 2 : 노면 차선 — 이 페이지의 시그니처 */
.hero::after{
  content:"";
  position:absolute; inset:0; z-index:-1;
  background:
    linear-gradient(to bottom, rgba(10,14,16,.60) 0%, rgba(10,14,16,.34) 44%, rgba(10,14,16,.80) 100%),
    radial-gradient(76% 60% at 50% 46%, transparent 0%, rgba(10,14,16,.55) 100%);
}
.lane{
  position:absolute; inset:0; z-index:-2;
  pointer-events:none;
  overflow:hidden;
}
.lane span{
  position:absolute;
  left:-6%; width:112%;
  height:3px;
  background:repeating-linear-gradient(90deg,
    rgba(242,194,48,.85) 0 62px, transparent 62px 116px);
  transform-origin:left center;
  opacity:0;
  animation:laneIn 1.5s cubic-bezier(.2,.7,.2,1) forwards;
}
.lane span:nth-child(1){ top:22%; transform:rotate(-3.2deg); animation-delay:.15s; }
.lane span:nth-child(2){ top:80%; transform:rotate(2.4deg);  animation-delay:.32s; height:2px; }
@keyframes laneIn{ from{opacity:0; clip-path:inset(0 100% 0 0);} to{opacity:.5; clip-path:inset(0 0 0 0);} }

.hero-inner{
  width:min(1100px,100%);
  text-align:center;
  animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
}

.eyebrow{
  display:inline-flex; align-items:center; gap:10px;
  font-family:var(--font-mono);
  font-size:clamp(10.5px,1.1vw,12.5px);
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--line-yellow);
  margin:0 0 clamp(20px,3vw,32px);
  padding:8px 16px;
  border:1px solid rgba(242,194,48,.32);
  border-radius:100px;
  background:rgba(242,194,48,.07);
  backdrop-filter:blur(6px);
}
.eyebrow .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--line-yellow);
  box-shadow:0 0 12px var(--line-yellow);
  animation:blink 1.9s ease-in-out infinite;
}
@keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

.wordmark{
  margin:0;
  font-size:clamp(52px,13vw,148px);
  font-weight:800;
  line-height:.94;
  letter-spacing:-.05em;
  text-shadow:0 4px 44px rgba(8,12,14,.7);
}
h1{
  margin:clamp(16px,2.4vw,26px) 0 0;
  font-size:clamp(17px,2.6vw,30px);
  font-weight:600;
  line-height:1.42;
  letter-spacing:-.025em;
  color:var(--paper);
  word-break:keep-all;
}
.sub{
  margin:clamp(12px,1.8vw,18px) 0 0;
  font-size:clamp(13.5px,1.5vw,17px);
  color:var(--muted);
  word-break:keep-all;
}

.byline{
  margin:clamp(24px,3.6vw,36px) 0 0;
  font-family:var(--font-mono);
  font-size:clamp(11.5px,1.3vw,13.5px);
  letter-spacing:.04em;
  color:var(--muted);
}
.byline strong{ color:var(--paper); font-weight:600; }

.rule{
  width:52px;height:1px;margin:clamp(26px,3.6vw,40px) auto;
  background:linear-gradient(90deg,transparent,rgba(242,194,48,.75),transparent);
}

.cta{
  display:inline-block;
  padding:16px 40px;
  border-radius:12px;
  background:var(--line-yellow);
  color:#1A1403;
  font-size:clamp(15px,1.6vw,17.5px);
  font-weight:700;
  text-decoration:none;
  letter-spacing:-.01em;
  transition:transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s ease, background .22s ease;
  box-shadow:0 10px 32px rgba(242,194,48,.22);
}
.cta:hover{ transform:translateY(-3px); background:#FFD34E; box-shadow:0 16px 42px rgba(242,194,48,.34); }
.cta:active{ transform:translateY(-1px); }
.cta:focus-visible{ outline:3px solid #fff; outline-offset:4px; }

.topics{
  position:absolute;
  left:50%; bottom:clamp(20px,4vh,44px);
  transform:translateX(-50%);
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px 10px;
  width:min(820px,90vw);
  animation:rise 1.1s .18s cubic-bezier(.2,.7,.2,1) both;
}
.topics span{
  font-family:var(--font-mono);
  font-size:clamp(9.5px,1.1vw,11.5px);
  letter-spacing:.07em;
  color:rgba(237,239,238,.55);
  border:1px solid rgba(237,239,238,.16);
  border-radius:100px;
  padding:6px 13px;
  white-space:nowrap;
}

@keyframes rise{ from{opacity:0; transform:translateY(22px);} to{opacity:1; transform:none;} }
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important;}
  .lane span{ opacity:.5; clip-path:none; }
  html{scroll-behavior:auto;}
}
@media (max-width:640px){
  .topics{ display:none; }
  .hero{ min-height:92svh; }
}
</style>
</head>
<body>

<main class="hero">
  <div class="lane" aria-hidden="true"><span></span><span></span></div>

  <div class="hero-inner">

    <p class="eyebrow"><span class="dot"></span>Sidewalk Riding Detector</p>

    <!-- ▼ 제목: 원하는 문구로 바꾸세요 ▼ -->
    <p class="wordmark">안전킥</p>
    <h1>공유킥보드가 지금 달리는 곳은<br>차도인가, 인도인가</h1>
    <p class="sub">노면 한 장으로 판별하는 CNN 실시간 인도주행 감지 프로그램</p>

    <p class="byline">전동킥보드 이용자들의 안전 확보를 위한 시스템 &nbsp;·&nbsp; <strong>10826 정연우</strong></p>

    <div class="rule"></div>

    <a class="cta" href="project.html">프로젝트 보기</a>
  </div>

  <div class="topics">
    <span>합성곱 신경망</span>
    <span>이진 분류</span>
    <span>데이터 증강</span>
    <span>PyTorch</span>
    <span>IP Webcam</span>
    <span>실시간 추론</span>
    <span>개인형 이동장치</span>
  </div>
</main>

</body>
</html>
